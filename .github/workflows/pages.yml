name: Deploy static exhibition pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp build version (HTML BUILD_ID + version.json, both from this commit)
        run: |
          echo "{\"build\":\"${GITHUB_SHA}\"}" > web/version.json
          # Replace ONLY the const declaration — the sentinel check
          # `BUILD_ID === "__BUILD_ID__"` must stay literal so an un-stamped/dev build never nags.
          sed -i "s|const BUILD_ID = \"__BUILD_ID__\"|const BUILD_ID = \"${GITHUB_SHA}\"|" web/admin-*.html web/user.html
          echo "version.json: $(cat web/version.json)"
          stamped=$(grep -l "const BUILD_ID = \"${GITHUB_SHA}\"" web/admin-*.html web/user.html | wc -l)
          echo "stamped files: ${stamped} (expect 2)"
          [ "${stamped}" -eq 2 ] || { echo "BUILD_ID not stamped in both apps"; exit 1; }
      - name: Upload web folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
